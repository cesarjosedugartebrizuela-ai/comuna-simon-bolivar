{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <title>Registro - Comunidad Activa</title>
    <style>
        body { background: linear-gradient(135px, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; }
        .card-register { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .btn-primary { background: #110f97; border: none; }
        .btn-primary:hover { background: #376a82; }
    </style>
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card card-register p-4">
                <div class="text-center mb-4">
                    <img src="{% static 'gestion/Logo2.png' %}" alt="Logo" style="width: 260px;">
                    <h2 class="fw-bold">Únete a la Comunidad</h2>
                </div>
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert {% if message.tags == 'success' %}alert-success{% else %}alert-danger{% endif %} alert-dismissible fade show shadow-sm" role="alert">
                            <i class="bi {% if message.tags == 'success' %}bi-check-circle-fill{% else %}bi-exclamation-triangle-fill{% endif %} me-2"></i>
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
                <form method="POST" class="row g-3">
                    {% csrf_token %}
                    <div class="col-md-12">
                        <input type="text" name="nombre" class="form-control" placeholder="Nombre Completo" required>
                    </div>
                    <div class="col-md-6">
                        <input type="text" name="cedula" class="form-control" placeholder="Cédula (Ej: V-12345678)" pattern="^[VEve]-[0-9]{7,9}$" title="Formato requerido: V- o E- seguido de 7 a 9 números (sin puntos ni espacios)" required>
                    </div>                
                    <div class="col-md-6">
                        <select name="genero" class="form-select" required>
                            <option value="" disabled selected>Género</option>
                            <option value="Femenino">Femenino</option>
                            <option value="Masculino">Masculino</option>
                        </select>
                    </div>
                    <div class="col-md-12">
                        <input type="date" name="fecha_nacimiento" class="form-control" required>
                    </div>
                    <div class="col-md-12">
                        <input type="email" name="email" class="form-control" placeholder="Correo Electrónico" required>
                    </div>
                    <div class="col-md-12">
                        <input type="text" name="telefono" class="form-control" placeholder="Número de Teléfono (Ej: 04141234567)" required>
                    </div>
                    <div class="col-md-12">
                        <input type="password" name="password" class="form-control" placeholder="Contraseña Segura (mínimo de 8 caracteres)" required>
                    </div>
                    <div class="col-md-12">
                        <select name="consejo_comunal" class="form-select" required>
                            <option value="" disabled selected>Seleccione su Consejo Comunal</option>
                            <option value="Andrés Bello">Andrés Bello</option>
                            <option value="Casco Histórico">Casco Histórico</option>
                            <option value="Panteón Nacional">Panteón Nacional</option>
                            <option value="Lomas de Urdaneta">Lomas de Urdaneta</option>
                            <option value="San José">San José</option>
                            <option value="La Pastora">La Pastora</option>
                            <option value="El Mirador">El Mirador</option>
                            <option value="Santa Teresa">Santa Teresa</option>
                        </select>
                    </div>
                    <div class="col-md-12">
                        <textarea name="direccion" class="form-control" placeholder="Dirección exacta" rows="2" required></textarea>
                    </div>
                    <div class="col-md-12">
                        <label class="small fw-bold">¿Posee alguna discapacidad?</label>
                        <select name="discapacidad" class="form-select">
                            <option value="No Posee">No Posee</option>
                            <option value="Auditiva">Auditiva</option>
                            <option value="Voz y Habla">Voz y Habla</option>
                            <option value="Visual">Visual</option>
                            <option value="Motriz">Motriz</option>
                            <option value="Intelectual">Intelectual</option>
                            <option value="Otra">Otra</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mt-4">Registrarme</button>
                    <div class="text-center mt-3">
                        <p class="small">¿Ya tienes cuenta? <a href="{% url 'login' %}" class="text-decoration-none fw-bold text-primary">Inicia sesión</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
