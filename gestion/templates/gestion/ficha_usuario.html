{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <title>Editar Perfil - {{ perfil.nombre_completo }}</title>
</head>
<body class="bg-light">
    <div class="container-fluid mt-3">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i>{{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}        
        <div class="row">
            <div class="col-md-12">
                <div class="card p-3 shadow-sm">
                    <h3 class=" fw-bold mb-0 text-center"> <i class="bi bi-person-gear text-primary me-2"></i>Mi Perfil / Editar Datos</h3>
                    <hr>
                    <div class="row g-3 align-center">
                        <div class="card-body">
                            <form method="POST" class="row g-3">
                                {% csrf_token %}
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">Nombre Completo</label>
                                    <input type="text" name="nombre_completo" class="form-control" value="{{ perfil.nombre_completo }}" required>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label fw-bold small">Cédula de Identidad</label>
                                    <input type="text" name="cedula_identidad" class="form-control" value="{{ perfil.cedula_identidad }}" required>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label fw-bold small">Fecha de Nacimiento</label>
                                    <input type="date" name="fecha_nacimiento" class="form-control" value="{{ perfil.fecha_nacimiento|date:'Y-m-d' }}" required>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label fw-bold small">Género</label>
                                    <select name="genero" class="form-select">
                                        <option value="Masculino" {% if perfil.genero == 'Masculino' %}selected{% endif %}>Masculino</option>
                                        <option value="Femenino" {% if perfil.genero == 'Femenino' %}selected{% endif %}>Femenino</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">Correo Electrónico</label>
                                    <input type="email" name="email" class="form-control" value="{{ perfil.email }}" required>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label fw-bold small">Teléfono</label>
                                    <input type="text" name="telefono" class="form-control" value="{{ perfil.telefono }}" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold small">Discapacidad / Condición</label>
                                    <select name="discapacidad" class="form-select" required>
                                        <option value="No Posee" {% if perfil.discapacidad == 'No Posee' %}selected{% endif %}>No Posee</option>
                                        <option value="Auditiva" {% if perfil.discapacidad == 'Auditiva' %}selected{% endif %}>Auditiva</option>
                                        <option value="Voz y Habla" {% if perfil.discapacidad == 'Voz y Habla' %}selected{% endif %}>Voz y Habla</option>
                                        <option value="Visual" {% if perfil.discapacidad == 'Visual' %}selected{% endif %}>Visual</option>
                                        <option value="Motriz" {% if perfil.discapacidad == 'Motriz' %}selected{% endif %}>Motriz</option>
                                        <option value="Intelectual" {% if perfil.discapacidad == 'Intelectual' %}selected{% endif %}>Intelectual</option>
                                        <option value="Otra" {% if perfil.discapacidad == 'Otra' %}selected{% endif %}>Otra</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">Consejo Comunal</label>
                                    <select name="consejo_comunal" class="form-select" required>
                                        <option value="Andrés Bello" {% if perfil.consejo_comunal == 'Andrés Bello' %}selected{% endif %}>Andrés Bello</option>
                                        <option value="Casco Histórico" {% if perfil.consejo_comunal == 'Casco Histórico' %}selected{% endif %}>Casco Histórico</option>
                                        <option value="Panteón Nacional" {% if perfil.consejo_comunal == 'Panteón Nacional' %}selected{% endif %}>Panteón Nacional</option>
                                        <option value="Lomas de Urdaneta" {% if perfil.consejo_comunal == 'Lomas de Urdaneta' %}selected{% endif %}>Lomas de Urdaneta</option>
                                        <option value="San José" {% if perfil.consejo_comunal == 'San José' %}selected{% endif %}>San José</option>
                                        <option value="La Pastora" {% if perfil.consejo_comunal == 'La Pastora' %}selected{% endif %}>La Pastora</option>
                                        <option value="El Mirador" {% if perfil.consejo_comunal == 'El Mirador' %}selected{% endif %}>El Mirador</option>
                                        <option value="Santa Teresa" {% if perfil.consejo_comunal == 'Santa Teresa' %}selected{% endif %}>Santa Teresa</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small text-danger">Cambiar Contraseña (opcional)</label>
                                    <input type="password" name="nueva_password" class="form-control" placeholder="Dejar en blanco para no cambiar">
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold small">Dirección Exacta</label>
                                    <textarea name="direccion" class="form-control" rows="2" required>{{ perfil.direccion }}</textarea>
                                </div>
                                <div class="col-12 mt-4 d-flex gap-2">
                                    <button type="submit" class="btn btn-outline-primary w-100 py-3 fw-bold rounded-pill shadow">
                                        <i class="bi bi-floppy-fill me-2"></i> Guardar Cambios
                                    </button>
                                    <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary w-100 py-3 fw-bold rounded-pill shadow">
                                        <i class="bi bi-house-door me-1"></i> Volver al Panel
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
