{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <title>Nueva Contraseña - Comunidad Activa</title>
</head>
<body class="bg-light">
    <div class="container vh-100 d-flex justify-content-center align-items-center">
        <div class="card p-4 shadow" style="width: 28rem;">
            <div class="text-center mb-3">
                <img src="{% static 'gestion/Logo2.png' %}" style="width: 260px;">
                <h4 class="mt-3 fw-bold">Nueva Contraseña</h4>
                <p class="text-muted small">Crea una clave segura para tu cuenta</p>
            </div>
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger p-2 small text-center">{{ message }}</div>
                {% endfor %}
            {% endif %}
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-bold">Nueva Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                        <input type="password" name="pass1" class="form-control" placeholder="Mínimo 8 caracteres" required minlength="8">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Confirmar Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock-check"></i></span>
                        <input type="password" name="pass2" class="form-control" placeholder="Repite tu contraseña" required minlength="8">
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100">Actualizar Contraseña</button>
            </form>
            
            <div class="text-center mt-3">
                <p class="text-muted extra-small" style="font-size: 0.75rem;">
                    <i class="bi bi-shield-lock"></i> Tu conexión es segura y tus datos están protegidos.
                </p>
            </div>
        </div>
    </div>
</body>
</html>
