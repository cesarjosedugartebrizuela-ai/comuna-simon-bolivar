{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <title>Acceso - Comunidad Activa</title>
</head>
<body class="bg-light">
    <div class="container vh-100 d-flex justify-content-center align-items-center">
        <div class="card p-4 shadow" style="width: 25rem;">
            <div class="text-center mb-3">
                <img src="{% static 'gestion/Logo2.png' %}" alt="Logo Comuna" style="width: 260px;">
            </div>
            <h2 class="text-center">Acceso Vecinal</h2>
            <p class="text-muted small text-center">Circuito Comunal Simón Bolívar Altagracia</p>
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger p-2 small text-center">{{ message }}</div>
                {% endfor %}
            {% endif %}
            <form method="POST">
                {% csrf_token %}  <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">Cédula de Identidad</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-card-text"></i></span>
                        <input type="text" name="usuario" class="form-control" placeholder="Ej: V-12345678" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">Tu Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar <i class="bi bi-box-arrow-in-right ms-2"></i></button>
                <div class="text-center mt-3">
                    <p class="small">¿Aún no estás registrado? 
                        <a href="{% url 'registro' %}" class="text-decoration-none fw-bold">Regístrate aquí</a>
                    </p>
                    <p class="small">¿Olvidaste tu contraseña?
                        <a href="{% url 'verificar_identidad' %}" class="text-decoration-none fw-bold">Recupérala aquí</a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
