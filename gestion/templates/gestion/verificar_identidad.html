{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <title>Verificar Identidad - Comunidad Activa</title>
</head>
<body class="bg-light">
    <div class="container vh-100 d-flex justify-content-center align-items-center">
        <div class="card p-4 shadow" style="width: 28rem;">
            <div class="text-center mb-3">
                <img src="{% static 'gestion/Logo2.png' %}" style="width: 260px;">
                <h4 class="mt-3 fw-bold">Recuperar Acceso</h4>
                <p class="text-muted small">Ingresa tus datos registrados para verificar tu identidad</p>
            </div>
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger p-2 small text-center">{{ message }}</div>
                {% endfor %}
            {% endif %}
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-bold">Cédula de Identidad</label>
                    <input type="text" name="cedula" class="form-control" placeholder="Ej: V-12345678" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Teléfono Celular</label>
                    <input type="text" name="telefono" class="form-control" placeholder="0412-0000000" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Correo Electrónico</label>
                    <input type="email" name="correo" class="form-control" placeholder="usuario@gmail.com" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Verificar Datos</button>
                <div class="text-center mt-3">
                    <a href="{% url 'login' %}" class="text-decoration-none small">Volver al inicio</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
