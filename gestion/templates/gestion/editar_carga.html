{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <title>Editar Familiar - {{ familiar.nombre_completo }}</title>
</head>
<body class="bg-light">
    <div class="container-fluid mt-3">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4 fw-bold">
                            <i class="text-primary bi bi-pencil-square"></i> Editar Información
                        </h3>
                        <hr>
                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Nombre y Apellido</label>
                                <input type="text" name="nombre_completo" class="form-control" value="{{ familiar.nombre_completo }}" required>
                            </div>
                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label class="form-label small fw-bold">Parentesco</label>
                                    <select name="parentesco" class="form-select">
                                        <option value="Hijo/a" {% if familiar.parentesco == 'Hijo/a' %}selected{% endif %}>Hijo/a</option>
                                        <option value="Sobrino/a" {% if familiar.parentesco == 'Sobrino/a' %}selected{% endif %}>Sobrino/a</option>
                                        <option value="Nieto/a" {% if familiar.parentesco == 'Nieto/a' %}selected{% endif %}>Nieto/a</option>
                                        <option value="Otro" {% if familiar.parentesco == 'Otro' %}selected{% endif %}>Otro</option>
                                    </select>
                                </div>
                                <div class="col-6 mb-3">
                                    <label class="form-label small fw-bold">Fecha de Nacimiento</label>
                                    <input type="date" name="fecha_nacimiento" class="form-control" value="{{ familiar.fecha_nacimiento|date:'Y-m-d' }}" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label class="form-label small fw-bold">Género</label>
                                    <select name="genero" class="form-select">
                                        <option value="Femenino" {% if familiar.genero == 'Femenino' %}selected{% endif %}>Femenino</option>
                                        <option value="Masculino" {% if familiar.genero == 'Masculino' %}selected{% endif %}>Masculino</option>
                                    </select>
                                </div>
                                <div class="col-6 mb-3">
                                    <label class="form-label small fw-bold">Escolarizado</label>
                                    <select name="escolarizado" class="form-select">
                                        <option value="si" {% if familiar.escolarizado == 'si' %}selected{% endif %}>Sí</option>
                                        <option value="no" {% if familiar.escolarizado == 'no' %}selected{% endif %}>No</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Cédula (Opcional si Posee)</label>
                                <input type="text" name="cedula_identidad" class="form-control" value="{{ familiar.cedula_identidad|default_if_none:'' }}">
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-bold">Discapacidad</label>
                                <select name="discapacidad" class="form-select">
                                    <option value="No Posee" {% if familiar.discapacidad == 'No Posee' %}selected{% endif %}>No Posee</option>
                                    <option value="Auditiva" {% if familiar.discapacidad == 'Auditiva' %}selected{% endif %}>Auditiva</option>
                                    <option value="Voz y Habla" {% if familiar.discapacidad == 'Voz y Habla' %}selected{% endif %}>Voz y Habla</option>
                                    <option value="Visual" {% if familiar.discapacidad == 'Visual' %}selected{% endif %}>Visual</option>
                                    <option value="Motriz" {% if familiar.discapacidad == 'Motriz' %}selected{% endif %}>Motriz</option>
                                    <option value="Intelectual" {% if familiar.discapacidad == 'Intelectual' %}selected{% endif %}>Intelectual</option>
                                    <option value="Otra" {% if familiar.discapacidad == 'Otra' %}selected{% endif %}>Otra</option>
                                </select>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-outline-primary w-100 rounded-pill fw-bold">
                                    <i class="bi bi-floppy-fill me-2"></i> Guardar Cambios</button>
                                <a href="{% url 'registrar_carga' %}" class="btn btn-outline-secondary w-100 py-3 fw-bold rounded-pill">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
